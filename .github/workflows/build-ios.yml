name: Build iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode 15.4 supports iOS 14 devices. GitHub retires this image on 2026-11-02.
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install packaging tools
        run: |
          brew install dpkg
          architecture="$(uname -m)"
          case "$architecture" in
            arm64) sha256=5dff8e6b8d9dc3ff7226276c81e09930865f15381f54cb55b98b196a94c5ca50 ;;
            x86_64) sha256=9d46e0feedf96e399edfca09872802ba21e729f79c01927ad25ea2b0a35bca23 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_$architecture" \
            --output "$RUNNER_TEMP/ldid"
          printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/ldid" | shasum -a 256 -c -
          chmod 755 "$RUNNER_TEMP/ldid"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build Release and Debug
        run: |
          mkdir -p build
          set -o pipefail
          for configuration in Release Debug; do
            xcodebuild -project Filos.xcodeproj -scheme Filos \
              -configuration "$configuration" -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "build/$configuration.log"
          done

      - name: Report build errors
        if: failure()
        run: |
          for log in build/*.log; do
            [ -f "$log" ] || continue
            grep -E 'error:|incompatible|cannot be opened' "$log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          done

      - name: Verify iOS 14.8 app
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/Filos.app
          python3 - "$app" <<'PY'
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          import sys
          app = Path(sys.argv[1])
          with (app / "Info.plist").open("rb") as file:
              info = plistlib.load(file)
          minimum = tuple(map(int, info["MinimumOSVersion"].split(".")))
          assert minimum <= (14, 8), f"App requires iOS {info['MinimumOSVersion']}, newer than iOS 14.8"
          print(f"Minimum iOS version: {info['MinimumOSVersion']}")
          binary = app / info["CFBundleExecutable"]
          commands = subprocess.check_output(["xcrun", "otool", "-l", str(binary)], text=True)
          versions = re.findall(r"\bminos\s+([\d.]+)", commands)
          assert versions, "Executable minimum iOS version was not found"
          assert all(tuple(map(int, version.split("."))) <= (14, 8) for version in versions), versions
          assert (app / "Frameworks/libswift_Concurrency.dylib").is_file(), "Missing Swift concurrency runtime for iOS 14"
          assert (app / "AppIcon60x60@2x.png").is_file(), "Missing iPhone app icon"
          print(f"Executable minimum iOS versions: {versions}; concurrency runtime and app icon present")
          PY
      - name: Package rootful Debian app
        run: bash debbuild.sh build/DerivedData/Build/Products/Release-iphoneos/Filos.app

      - uses: actions/upload-artifact@v7
        with:
          name: Filos-rootful
          path: build/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log
          path: build/*.log
          if-no-files-found: ignore
